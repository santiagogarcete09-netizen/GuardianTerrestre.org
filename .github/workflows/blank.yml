<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guardián Terrestre — Sitio Oficial · EXPOTEC 2026 · Equipo S.A.C.</title>
<meta name="description" content="Guardián Terrestre: robot cuadrúpedo del Equipo S.A.C. Proyecto de EXPOTEC 2026 del Colegio Salesianito, orientado a la exploración remota de zonas de difícil acceso.">
<meta name="theme-color" content="#2d4a3e">
<meta name="author" content="Equipo S.A.C. — Santiago Garcete, Alan Martínez, Cecilia Ruiz">
<meta property="og:type" content="website">
<meta property="og:title" content="Guardián Terrestre — Sitio Oficial">
<meta property="og:description" content="Robot cuadrúpedo del Equipo S.A.C. Proyecto de EXPOTEC 2026 del Colegio Salesianito.">
<meta property="og:locale" content="es_ES">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232d4a3e'/%3E%3Ctext x='32' y='44' font-family='system-ui,-apple-system,sans-serif' font-size='28' font-weight='600' fill='%23fafafa' text-anchor='middle'%3EGT%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#fafafa;
    --bg-soft:#f4f6f4;
    --bg-accent:#eef3ef;
    --text:#0d1210;
    --muted:#6a7570;
    --muted-2:#99a29d;
    --line:#e4e8e5;
    --line-strong:#c8d0ca;
    --accent:#2d4a3e;
    --accent-2:#7fa88f;
    --accent-glow:rgba(45,74,62,.14);
    --accent-glow-soft:rgba(127,168,143,.18);
    --ease:cubic-bezier(0.22, 1, 0.36, 1);
    --ease-slow:cubic-bezier(0.19, 1, 0.22, 1);
    --dur-fast:.9s;
    --dur:1.3s;
    --dur-hover:1.3s;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth;-webkit-font-smoothing:antialiased;scroll-padding-top:80px}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);line-height:1.7;font-size:16px;
    overflow-x:hidden;position:relative;
  }
  /* Fondo */
  .bg-layer{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  .bg-layer::before{
    content:'';position:absolute;inset:0;
    background-image:radial-gradient(circle, var(--line-strong) 1px, transparent 1px);
    background-size:32px 32px;opacity:.35;
  }
  .bg-layer::after{
    content:'';position:absolute;inset:0;
    background-image:
      linear-gradient(to right, var(--line) 1px, transparent 1px),
      linear-gradient(to bottom, var(--line) 1px, transparent 1px);
    background-size:160px 160px;opacity:.55;
    mask-image:radial-gradient(ellipse at center, black 30%, transparent 85%);
    -webkit-mask-image:radial-gradient(ellipse at center, black 30%, transparent 85%);
  }
  .bg-orb{position:fixed;border-radius:50%;filter:blur(70px);pointer-events:none;z-index:0;opacity:.55}
  .bg-orb.one{top:-180px;right:-140px;width:520px;height:520px;background:radial-gradient(circle at 30% 30%, var(--accent-glow), transparent 70%)}
  .bg-orb.two{bottom:-220px;left:-180px;width:600px;height:600px;background:radial-gradient(circle at 60% 40%, var(--accent-glow-soft), transparent 70%)}
  .bg-vlines{position:fixed;inset:0;pointer-events:none;z-index:0}
  .bg-vlines span{position:absolute;top:0;bottom:0;width:1px;background:linear-gradient(180deg,transparent,var(--line-strong) 20%,var(--line-strong) 80%,transparent);opacity:.5}
  .bg-vlines span:nth-child(1){left:6%}
  .bg-vlines span:nth-child(2){left:50%}
  .bg-vlines span:nth-child(3){right:6%}
  .bg-crosses{position:fixed;inset:0;pointer-events:none;z-index:0}
  .bg-crosses i{position:absolute;width:14px;height:14px;opacity:.55}
  .bg-crosses i::before,.bg-crosses i::after{content:'';position:absolute;background:var(--line-strong)}
  .bg-crosses i::before{top:50%;left:0;right:0;height:1px}
  .bg-crosses i::after{left:50%;top:0;bottom:0;width:1px}
  .bg-crosses i:nth-child(1){top:12%;left:8%}
  .bg-crosses i:nth-child(2){top:32%;right:10%}
  .bg-crosses i:nth-child(3){top:58%;left:5%}
  .bg-crosses i:nth-child(4){top:78%;right:8%}
  .bg-crosses i:nth-child(5){top:88%;left:12%}
  .bg-noise{
    position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.035;mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160' viewBox='0 0 160 160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }
  body > *:not(.bg-layer):not(.bg-orb):not(.bg-vlines):not(.bg-crosses):not(.bg-noise){
    position:relative;z-index:1;
  }
  a{color:inherit;text-decoration:none}
  img{max-width:100%;display:block}
  ::selection{background:var(--accent);color:var(--bg)}
  .wrap{max-width:780px;margin:0 auto;padding:0 32px;position:relative}

  .progress{position:fixed;top:0;left:0;height:2px;background:linear-gradient(90deg,var(--accent-2),var(--accent));width:0%;z-index:200;transition:width .12s linear}

  /* NAV */
  nav{position:sticky;top:0;background:rgba(250,250,250,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);z-index:100}
  .nav-inner{max-width:1000px;margin:0 auto;padding:18px 32px;display:flex;justify-content:space-between;align-items:center;gap:24px;position:relative}
  .nav-brand{font-size:14px;font-weight:600;letter-spacing:-0.01em;display:flex;align-items:center;gap:10px;flex-shrink:0;transition:opacity var(--dur-fast) var(--ease)}
  .nav-brand:hover{opacity:.6}
  .nav-brand .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block;animation:breathe 3.2s ease-in-out infinite}
  @keyframes breathe{0%,100%{opacity:1;transform:scale(1);box-shadow:0 0 0 0 var(--accent-glow)}50%{opacity:.7;transform:scale(.85);box-shadow:0 0 0 6px transparent}}
  .nav-official{font-size:10px;color:var(--accent);letter-spacing:.1em;text-transform:uppercase;font-weight:600;padding:2px 8px;border:1px solid var(--accent);border-radius:100px;background:var(--bg);white-space:nowrap}
  .nav-links{display:flex;gap:20px;font-size:13px;color:var(--muted);flex-wrap:wrap;justify-content:flex-end}
  .nav-links a{transition:color var(--dur-fast) var(--ease);position:relative;padding:4px 0;cursor:pointer}
  .nav-links a:hover{color:var(--text)}
  .nav-links a.active{color:var(--text);font-weight:500}
  .nav-links a.active::after{content:'';position:absolute;left:0;right:0;bottom:-2px;height:1px;background:var(--accent);animation:slideIn var(--dur) var(--ease) both;transform-origin:left}
  @keyframes slideIn{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  .nav-toggle{display:none;background:none;border:1px solid var(--line);padding:8px 10px;border-radius:4px;cursor:pointer;flex-direction:column;gap:4px;flex-shrink:0}
  .nav-toggle span{display:block;width:16px;height:1.5px;background:var(--text);transition:.5s var(--ease)}
  .nav-toggle.open span:nth-child(1){transform:translateY(5.5px) rotate(45deg)}
  .nav-toggle.open span:nth-child(2){opacity:0}
  .nav-toggle.open span:nth-child(3){transform:translateY(-5.5px) rotate(-45deg)}

  /* HERO */
  .hero{padding:120px 0 90px;position:relative;overflow:hidden}
  .hero::before{content:'';position:absolute;top:20%;left:-15%;width:70%;height:70%;background:radial-gradient(ellipse at center, var(--accent-glow), transparent 65%);pointer-events:none;z-index:-1}
  .hero::after{content:'GT';position:absolute;top:20px;right:-10px;font-size:280px;font-weight:800;color:var(--accent);opacity:.045;line-height:1;letter-spacing:-0.05em;pointer-events:none;z-index:-1;user-select:none}
  .hero .label{font-size:12px;color:var(--muted);margin-bottom:24px;letter-spacing:0.08em;text-transform:uppercase;display:inline-flex;align-items:center;gap:10px;padding:5px 12px;border:1px solid var(--line);border-radius:100px;background:var(--bg)}
  .hero .label::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--accent);display:inline-block;animation:breathe 3.2s ease-in-out infinite}
  .hero h1{font-size:58px;line-height:1.05;font-weight:600;letter-spacing:-0.035em;margin-bottom:28px}
  .hero h1 em{font-style:normal;color:var(--accent);font-weight:400}
  .hero .desc{font-size:19px;color:var(--muted);max-width:620px;line-height:1.6}
  .hero .inst{margin-top:22px;font-size:13px;color:var(--muted);letter-spacing:.02em}
  .hero .inst strong{color:var(--text)}

  .hero-meta{margin-top:64px;display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);background:rgba(250,250,250,.7);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);overflow:hidden;position:relative}
  .hero-meta::before,.hero-meta::after{content:'';position:absolute;width:14px;height:14px;border:1px solid var(--accent);pointer-events:none}
  .hero-meta::before{top:-1px;left:-1px;border-right:0;border-bottom:0}
  .hero-meta::after{bottom:-1px;right:-1px;border-left:0;border-top:0}
  .hero-meta .cell{padding:24px 20px;border-right:1px solid var(--line);transition:background var(--dur-hover) var(--ease);display:flex;flex-direction:column;gap:6px}
  .hero-meta .cell:last-child{border-right:0}
  .hero-meta .cell:hover{background:var(--bg-accent)}
  .hero-meta .num{font-size:22px;font-weight:600;letter-spacing:-0.02em;line-height:1;font-variant-numeric:tabular-nums;transition:transform var(--dur-hover) var(--ease),color var(--dur-hover) var(--ease)}
  .hero-meta .cell:hover .num{transform:translateX(5px);color:var(--accent)}
  .hero-meta .cap{font-size:10px;color:var(--muted);letter-spacing:0.09em;text-transform:uppercase;line-height:1.4}

  .hero .label,.hero h1,.hero .desc,.hero .inst,.hero-meta{animation:heroIn 1.6s var(--ease-slow) backwards}
  .hero .label{animation-delay:.1s}
  .hero h1{animation-delay:.3s}
  .hero .desc{animation-delay:.5s}
  .hero .inst{animation-delay:.65s}
  .hero-meta{animation-delay:.85s}
  @keyframes heroIn{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}

  /* SECCIONES */
  section{padding:100px 0;border-top:1px solid var(--line);position:relative;overflow:hidden}
  section .watermark{position:absolute;top:32px;right:-20px;font-size:220px;font-weight:800;line-height:1;color:var(--accent);opacity:.035;letter-spacing:-0.05em;pointer-events:none;user-select:none;font-variant-numeric:tabular-nums;z-index:0}
  section > .wrap{position:relative;z-index:1}

  .sec-head{display:flex;align-items:center;gap:14px;margin-bottom:28px;flex-wrap:wrap}
  .sec-badge{width:28px;height:28px;border-radius:50%;border:1px solid var(--accent);display:grid;place-items:center;font-size:11px;font-weight:600;color:var(--accent);letter-spacing:0.02em;flex-shrink:0;background:var(--bg);font-variant-numeric:tabular-nums}
  .sec-label{font-size:12px;color:var(--muted);letter-spacing:0.12em;text-transform:uppercase}
  .sec-line{flex:1;height:1px;background:linear-gradient(90deg,var(--line-strong),transparent);margin-left:8px;min-width:40px}

  h2{font-size:34px;font-weight:600;letter-spacing:-0.025em;line-height:1.2;margin-bottom:22px}
  h3{font-size:16px;font-weight:600;letter-spacing:-0.01em;margin-bottom:6px}
  p{color:var(--muted);margin-bottom:16px;font-size:15px}
  p:last-child{margin-bottom:0}
  strong{color:var(--text);font-weight:600}
  .note{font-size:13px;color:var(--muted-2);font-style:italic;margin-top:20px;padding-left:14px;border-left:2px solid var(--line-strong)}

  /* LISTA CON ICONO */
  .items{display:grid;gap:0}
  .item-row{display:grid;grid-template-columns:56px 1fr;gap:26px;padding:28px 0;border-bottom:1px solid var(--line);align-items:start;transition:padding-left var(--dur-hover) var(--ease),background var(--dur-hover) var(--ease);position:relative}
  .item-row:last-child{border-bottom:0}
  .item-row::before{content:'';position:absolute;left:0;top:28px;bottom:28px;width:2px;background:var(--accent);transform:scaleY(0);transform-origin:top;transition:transform var(--dur-hover) var(--ease)}
  .item-row:hover{padding-left:24px;background:linear-gradient(90deg,var(--bg-accent) 0%,transparent 75%)}
  .item-row:hover::before{transform:scaleY(1)}
  .item-icon{width:44px;height:44px;border:1px solid var(--line-strong);border-radius:50%;display:grid;place-items:center;color:var(--muted);background:var(--bg);transition:color var(--dur-hover) var(--ease),border-color var(--dur-hover) var(--ease),background var(--dur-hover) var(--ease),transform var(--dur-hover) var(--ease)}
  .item-icon svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .item-row:hover .item-icon{color:var(--bg);background:var(--accent);border-color:var(--accent);transform:rotate(-6deg) scale(1.05)}
  .item-row h3{margin-bottom:6px}
  .item-row p{font-size:14px;margin-bottom:0}
  .item-num{font-size:12px;color:var(--muted);padding-top:14px;font-variant-numeric:tabular-nums;letter-spacing:0.06em;font-weight:500;transition:color var(--dur-hover) var(--ease)}
  .item-row:hover .item-num{color:var(--accent)}

  /* GRID 2 COL */
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0;border-top:1px solid var(--line)}
  .grid2 .cell{padding:30px 24px 30px 0;border-bottom:1px solid var(--line);transition:background var(--dur-hover) var(--ease)}
  .grid2 .cell:nth-child(odd){border-right:1px solid var(--line);padding-right:24px}
  .grid2 .cell:nth-child(even){padding-left:24px}
  .grid2 .cell:hover{background:var(--bg-accent)}
  .grid2 .cell h3{margin-bottom:8px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .grid2 .cell h3 .badge{font-size:10px;font-weight:500;color:var(--accent);border:1px solid var(--accent);border-radius:100px;padding:1px 7px;letter-spacing:0.04em;background:var(--bg);white-space:nowrap}
  .grid2 .cell p{font-size:14px;margin-bottom:0}

  /* FICHA */
  .ficha{border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:rgba(250,250,250,.75);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .ficha-row{display:flex;justify-content:space-between;align-items:baseline;padding:18px 16px;border-bottom:1px solid var(--line);gap:24px;transition:padding-left var(--dur-hover) var(--ease),background var(--dur-hover) var(--ease);position:relative}
  .ficha-row:last-child{border-bottom:0}
  .ficha-row::before{content:'';position:absolute;left:0;top:50%;width:0;height:1px;background:var(--accent);transition:width var(--dur-hover) var(--ease)}
  .ficha-row:hover{padding-left:28px;background:var(--bg-accent)}
  .ficha-row:hover::before{width:14px}
  .ficha-row .k{font-size:13px;color:var(--muted);letter-spacing:0.02em;transition:color var(--dur-hover) var(--ease)}
  .ficha-row:hover .k{color:var(--accent)}
  .ficha-row .v{font-size:15px;font-weight:500;text-align:right;font-variant-numeric:tabular-nums}

  /* TABLA */
  .tabla-wrap{overflow-x:auto;border:1px solid var(--line);padding:0 22px;position:relative;background:rgba(250,250,250,.75);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .tabla-wrap::before,.tabla-wrap::after{content:'';position:absolute;width:14px;height:14px;border:1px solid var(--accent);pointer-events:none}
  .tabla-wrap::before{top:-1px;left:-1px;border-right:0;border-bottom:0}
  .tabla-wrap::after{bottom:-1px;right:-1px;border-left:0;border-top:0}
  table{width:100%;border-collapse:collapse;font-size:14px;min-width:480px}
  th,td{text-align:left;padding:16px 0;border-bottom:1px solid var(--line)}
  th{font-weight:500;color:var(--muted);font-size:11px;letter-spacing:0.08em;text-transform:uppercase}
  td:first-child{color:var(--muted)}
  td:not(:first-child){text-align:center;width:110px}
  th:not(:first-child){text-align:center;width:110px}
  tbody tr{transition:background var(--dur-hover) var(--ease)}
  tbody tr:last-child td{border-bottom:0}
  tbody tr:hover{background:var(--bg-accent)}
  .yes{color:var(--accent);font-weight:600}
  .no{color:var(--muted-2)}

  /* RESULTADOS — gráfico de barras CSS */
  .chart{margin-top:40px;background:rgba(250,250,250,.75);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid var(--line);padding:36px 32px;position:relative}
  .chart::before,.chart::after{content:'';position:absolute;width:14px;height:14px;border:1px solid var(--accent);pointer-events:none}
  .chart::before{top:-1px;left:-1px;border-right:0;border-bottom:0}
  .chart::after{bottom:-1px;right:-1px;border-left:0;border-top:0}
  .chart-title{font-size:14px;font-weight:600;letter-spacing:-.01em;color:var(--text);margin-bottom:4px}
  .chart-sub{font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:28px}
  .bar-row{display:grid;grid-template-columns:180px 1fr 46px;gap:16px;align-items:center;padding:9px 0;font-size:13px}
  .bar-row .k{color:var(--text);font-weight:500}
  .bar-row .k small{display:block;color:var(--muted-2);font-weight:400;font-size:11px;letter-spacing:.02em}
  .bar-track{height:22px;background:var(--bg-accent);border:1px solid var(--line);position:relative;overflow:hidden}
  .bar-fill{height:100%;background:var(--accent);width:0;transition:width 2s var(--ease-slow)}
  .bar-fill.visible{width:var(--w)}
  .bar-row .v{font-size:13px;font-weight:600;color:var(--accent);text-align:right;font-variant-numeric:tabular-nums}
  .chart-foot{margin-top:22px;padding-top:18px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .chart-foot b{color:var(--text)}

  /* MÉTRICAS */
  .metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:32px}
  .metric{background:rgba(250,250,250,.75);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid var(--line);padding:24px 22px;text-align:center;transition:border-color var(--dur-hover) var(--ease),transform var(--dur-hover) var(--ease)}
  .metric:hover{border-color:var(--accent);transform:translateY(-3px)}
  .metric .num{font-size:30px;font-weight:600;color:var(--accent);letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
  .metric .lbl{font-size:11px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-top:10px;line-height:1.4}

  /* ANTECEDENTES */
  .antecedentes{border-top:1px solid var(--line)}
  .ante-row{display:grid;grid-template-columns:64px 1fr;gap:22px;padding:26px 0;border-bottom:1px solid var(--line);align-items:start;transition:padding-left var(--dur-hover) var(--ease)}
  .ante-row:last-child{border-bottom:0}
  .ante-row:hover{padding-left:12px}
  .ante-num{font-size:11px;font-weight:600;color:var(--accent);padding-top:4px;letter-spacing:.06em;font-variant-numeric:tabular-nums;border-right:1px solid var(--line);padding-right:16px;line-height:1.6}
  .ante-row h3{margin-bottom:6px}
  .ante-row p{font-size:14px;margin-bottom:0}

  /* EQUIPO */
  .team{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .member{padding:36px 20px;text-align:center;border:1px solid var(--line);background:rgba(250,250,250,.75);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:background var(--dur-hover) var(--ease),border-color var(--dur-hover) var(--ease),transform var(--dur-hover) var(--ease);position:relative;overflow:hidden}
  .member::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%) scaleX(0);width:40px;height:2px;background:var(--accent);transform-origin:center;transition:transform var(--dur-hover) var(--ease)}
  .member:hover{background:var(--bg-accent);border-color:var(--accent);transform:translateY(-4px)}
  .member:hover::before{transform:translateX(-50%) scaleX(1)}
  .member .avatar{width:64px;height:64px;border-radius:50%;border:1px solid var(--line-strong);display:grid;place-items:center;margin:0 auto 18px;font-size:22px;font-weight:500;letter-spacing:0.02em;background:var(--bg);position:relative;transition:background var(--dur-hover) var(--ease),color var(--dur-hover) var(--ease),border-color var(--dur-hover) var(--ease),transform var(--dur-hover) var(--ease)}
  .member .avatar::after{content:'';position:absolute;inset:-6px;border-radius:50%;border:1px dashed var(--line-strong);opacity:0;transition:opacity var(--dur-hover) var(--ease),transform var(--dur-hover) var(--ease);transform:scale(.9)}
  .member:hover .avatar::after{opacity:.6;transform:scale(1)}
  .member:hover .avatar{background:var(--accent);color:var(--bg);border-color:var(--accent);transform:translateY(-3px) scale(1.05)}
  .member h3{font-size:14px;margin-bottom:4px;line-height:1.3}
  .member .role{font-size:12px;color:var(--muted)}

  /* GALERÍA */
  .galeria{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:32px}
  .galeria .ph{aspect-ratio:4/3;border:1px solid var(--line);background:var(--bg-soft);display:grid;place-items:center;color:var(--muted);text-align:center;padding:12px;cursor:pointer;position:relative;overflow:hidden;transition:border-color var(--dur-hover) var(--ease),background var(--dur-hover) var(--ease),transform var(--dur-hover) var(--ease)}
  .galeria .ph::before{content:'';position:absolute;top:10px;left:10px;width:8px;height:8px;border-top:1px solid var(--line-strong);border-left:1px solid var(--line-strong);transition:border-color var(--dur-hover) var(--ease),width var(--dur-hover) var(--ease),height var(--dur-hover) var(--ease)}
  .galeria .ph::after{content:'+';position:absolute;right:12px;bottom:8px;font-size:16px;color:var(--muted-2);font-weight:300;transition:transform var(--dur-hover) var(--ease),color var(--dur-hover) var(--ease)}
  .galeria .ph:hover{border-color:var(--accent);background:var(--bg-accent);transform:translateY(-4px)}
  .galeria .ph:hover::before{border-color:var(--accent);width:14px;height:14px}
  .galeria .ph:hover::after{color:var(--accent);transform:rotate(90deg)}
  .galeria .ph span{color:var(--muted-2);font-size:11px;line-height:1.4;letter-spacing:0.03em}

  /* FAQ */
  .faq-item{border-bottom:1px solid var(--line);transition:background var(--dur-hover) var(--ease)}
  .faq-item:first-child{border-top:1px solid var(--line)}
  .faq-item:hover{background:var(--bg-accent)}
  .faq-item.open{background:var(--bg-accent)}
  .faq-q{width:100%;background:none;border:0;padding:22px 0;font-size:15px;font-weight:500;font-family:inherit;color:var(--text);text-align:left;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:20px;transition:padding-left var(--dur-hover) var(--ease)}
  .faq-item:hover .faq-q,.faq-item.open .faq-q{padding-left:14px}
  .faq-q .chev{color:var(--accent);font-size:18px;font-weight:300;line-height:1;flex-shrink:0;transition:transform var(--dur) var(--ease)}
  .faq-item.open .faq-q .chev{transform:rotate(45deg)}
  .faq-a{max-height:0;overflow:hidden;transition:max-height var(--dur) var(--ease)}
  .faq-a p{padding:0 0 24px 14px;font-size:14px;max-width:640px}

  /* CONTACTO */
  .contact-list{margin-top:28px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:rgba(250,250,250,.7);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .contact-row{display:flex;justify-content:space-between;align-items:baseline;padding:18px 16px;border-bottom:1px solid var(--line);gap:24px;flex-wrap:wrap;transition:padding-left var(--dur-hover) var(--ease),background var(--dur-hover) var(--ease)}
  .contact-row:last-child{border-bottom:0}
  .contact-row:hover{padding-left:28px;background:var(--bg-accent)}
  .contact-row .k{font-size:13px;color:var(--muted);letter-spacing:0.02em;transition:color var(--dur-hover) var(--ease)}
  .contact-row:hover .k{color:var(--accent)}
  .contact-row .v{font-size:15px;font-weight:500;text-align:right}

  /* BOTONES */
  .btn{display:inline-block;padding:13px 28px;font-size:14px;font-weight:500;background:var(--accent);color:var(--bg);border:0;cursor:pointer;font-family:inherit;transition:transform var(--dur-hover) var(--ease),letter-spacing var(--dur-hover) var(--ease),box-shadow var(--dur-hover) var(--ease);letter-spacing:.02em;position:relative}
  .btn:hover{transform:translateY(-2px);letter-spacing:.06em;box-shadow:0 8px 24px var(--accent-glow)}
  .btn:active{transform:translateY(0)}

  /* FOOTER */
  footer{border-top:1px solid var(--line);padding:60px 0 40px;font-size:13px;color:var(--muted);position:relative;background:rgba(250,250,250,.75);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .foot{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap}
  .foot-brand{font-size:14px;font-weight:600;color:var(--text);margin-bottom:6px;display:flex;align-items:center;gap:10px}
  .foot-brand::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block}
  .foot-meta{font-size:11px;color:var(--muted-2);margin-top:8px;letter-spacing:.04em}
  .foot-meta b{color:var(--muted);font-weight:500}

  /* REVEAL */
  .reveal{opacity:0;transform:translateY(34px);filter:blur(4px);transition:opacity 1.6s var(--ease-slow),transform 1.6s var(--ease-slow),filter 1.6s var(--ease-slow);will-change:opacity,transform,filter}
  .reveal.visible{opacity:1;transform:translateY(0);filter:blur(0)}

  /* RESPONSIVE */
  @media (max-width:900px){
    .bg-vlines span:nth-child(1){left:4%}
    .bg-vlines span:nth-child(3){right:4%}
    .metrics{grid-template-columns:1fr 1fr}
  }
  @media (max-width:760px){
    .nav-toggle{display:flex}
    .nav-links{position:absolute;top:100%;left:0;right:0;background:var(--bg);border-bottom:1px solid var(--line);flex-direction:column;gap:0;padding:0 32px;max-height:0;overflow:hidden;transition:max-height .7s var(--ease),padding .7s var(--ease)}
    .nav-links.open{max-height:800px;padding:12px 32px 20px}
    .nav-links a{padding:12px 0;border-bottom:1px solid var(--line);width:100%}
    .nav-links a:last-child{border-bottom:0}
    .nav-links a.active::after{display:none}
  }
  @media (max-width:640px){
    .wrap{padding:0 24px}
    .nav-inner{padding:16px 24px}
    .nav-official{display:none}
    .hero{padding:80px 0 60px}
    .hero h1{font-size:40px}
    .hero .desc{font-size:17px}
    .hero::after{font-size:180px;top:40px}
    section .watermark{font-size:140px;right:-10px}
    .hero-meta{grid-template-columns:1fr 1fr;margin-top:48px}
    .hero-meta .cell{border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
    .hero-meta .cell:nth-child(2n){border-right:0}
    .hero-meta .cell:nth-last-child(-n+2){border-bottom:0}
    .hero-meta .num{font-size:18px}
    h2{font-size:26px}
    section{padding:70px 0}
    .grid2{grid-template-columns:1fr}
    .grid2 .cell{padding:24px 0;border-right:0!important;padding-left:0!important}
    .team{grid-template-columns:1fr}
    .galeria{grid-template-columns:1fr 1fr}
    .item-row{grid-template-columns:44px 1fr;gap:18px}
    .tabla-wrap{padding:0 16px}
    .bg-vlines,.bg-crosses i:nth-child(3),.bg-crosses i:nth-child(5){display:none}
    .chart{padding:24px 18px}
    .bar-row{grid-template-columns:120px 1fr 40px;gap:10px;font-size:12px}
    .bar-row .k small{font-size:10px}
    .ante-row{grid-template-columns:44px 1fr;gap:16px}
    .ante-num{padding-right:12px;font-size:10px}
  }
</style>
</head>
