<!-- 10 · FAQ -->
<section id="faq">
  <span class="watermark">10</span>
  <div class="wrap">
    <div class="sec-head"><span class="sec-badge">10</span><span class="sec-label">Preguntas frecuentes</span><span class="sec-line"></span></div>
    <h2>Dudas habituales</h2>

    <div style="margin-top:32px">
      <div class="faq-item">
        <button class="faq-q">¿Qué diferencia hay entre Guardián Terrestre y Spot Micro AI?<span class="chev">+</span></button>
        <div class="faq-a"><p>Spot Micro AI es un proyecto de código abierto que sirve como base técnica. Guardián Terrestre comparte los principios de locomoción cuadrúpeda, pero agrega una ESP32-CAM con WiFi para transmitir video en tiempo real y enfoca el prototipo a la exploración remota de zonas de difícil acceso.</p></div>
      </div>
      <div class="faq-item">
        <button class="faq-q">¿Es un reemplazo de los equipos de rescate?<span class="chev">+</span></button>
        <div class="faq-a"><p>No. Guardián Terrestre es un prototipo educativo y experimental. Su propósito es funcionar como herramienta de apoyo durante una exploración inicial, sin reemplazar a los equipos profesionales de búsqueda y rescate ni operar en emergencias reales.</p></div>
      </div>
      <div class="faq-item">
        <button class="faq-q">¿Cómo se controla el robot?<span class="chev">+</span></button>
        <div class="faq-a"><p>Es teledirigido por Bluetooth: el operador envía las órdenes desde un dispositivo móvil y el Arduino Mega 2560 las traduce en movimientos coordinados sobre los 12 servos. Además, recibe el video de la ESP32-CAM para tomar decisiones. Alcance probado: 10 m en espacio libre.</p></div>
      </div>
      <div class="faq-item">
        <button class="faq-q">¿Cuánto pesa, mide y qué alcance tiene?<span class="chev">+</span></button>
        <div class="faq-a"><p>Pesa aproximadamente 1 kg, mide entre 24 y 26 cm de largo y su chasis está fabricado en PLA por impresión 3D. Se desplaza a una velocidad media de 0.24 m/s en pista plana y transmite video en 720p a 15 fps con ~120 ms de latencia.</p></div>
      </div>
      <div class="faq-item">
        <button class="faq-q">¿Cómo se alimenta?<span class="chev">+</span></button>
        <div class="faq-a"><p>Con una batería LiPo de 7.4 V, 2200 mAh y 25C, regulada mediante un módulo Buck que entrega la corriente necesaria para mover los 12 servomotores MG996R de forma estable.</p></div>
      </div>
      <div class="faq-item">
        <button class="faq-q">¿En qué estado se encuentra el proyecto?<span class="chev">+</span></button>
        <div class="faq-a"><p>El robot está funcional y ya fue sometido a pruebas de movimiento, estabilidad, control inalámbrico y transmisión de imágenes. Obtuvo un 80 % de funcionamiento global en las pruebas realizadas. Está próximo a su presentación pública en EXPOTEC 2026.</p></div>
      </div>
      <div class="faq-item">
        <button class="faq-q">¿Qué usos se le pueden dar?<span class="chev">+</span></button>
        <div class="faq-a"><p>Inspección de escombros y derrumbes, exploración de zonas contaminadas, vigilancia de áreas peligrosas, apoyo en labores de búsqueda y cualquier escenario donde sea preferible enviar un robot antes que a un ser vivo.</p></div>
      </div>
    </div>
  </div>
</section>

