<!-- HERO -->
<header class="hero wrap" id="top">
  <div class="label">Proyecto de EXPOTEC 2026 · Equipo S.A.C.</div>
  <h1>Guardián <em>Terrestre</em></h1>
  <p class="desc">
    Robot cuadrúpedo desarrollado como prototipo educativo para explorar zonas de difícil
    acceso y obtener información visual del entorno mediante control remoto inalámbrico.
    Basado en la plataforma de código abierto <strong>Spot Micro AI</strong>.
  </p>
  <p class="inst">
    <strong>Colegio y Escuela Técnica Sagrado Corazón de Jesús · Salesianito</strong><br>
    Bachillerato Técnico en Mecatrónica · Tercero · Asunción, Paraguay
  </p>

  <div class="hero-meta">
    <div class="cell"><span class="num">12</span><span class="cap">Servomotores MG996R</span></div>
    <div class="cell"><span class="num">3 m</span><span class="cap">Desplazamiento probado</span></div>
    <div class="cell"><span class="num">10 m</span><span class="cap">Alcance Bluetooth</span></div>
    <div class="cell"><span class="num">80 %</span><span class="cap">Funcionamiento global</span></div>
  </div>
</header>

<!-- 01 · PROYECTO -->
<section id="proyecto">
  <span class="watermark">01</span>
  <div class="wrap">
    <div class="sec-head"><span class="sec-badge">01</span><span class="sec-label">El proyecto</span><span class="sec-line"></span></div>
    <h2>Un prototipo para explorar donde una persona no debería entrar</h2>
    <p>
      <strong>Guardián Terrestre</strong> surgió a partir del interés por aplicar los conocimientos
      del Bachillerato Técnico en Mecatrónica a una situación concreta: la exploración de lugares
      de difícil acceso. La propuesta tomó como referencia robots cuadrúpedos existentes,
      especialmente aquellos utilizados con fines educativos, de inspección y exploración.
    </p>
    <p>
      El prototipo fue diseñado para ser controlado de forma remota y para transmitir información
      visual del entorno. Para ello se integraron servomotores encargados del movimiento de las
      patas, un sensor MPU-6050 para registrar inclinación y movimiento, un sistema de comunicación
      Bluetooth y una cámara ESP32-CAM.
    </p>
    <p>
      La importancia del proyecto radica en la posibilidad de <strong>reducir la exposición directa
      de una persona durante una exploración inicial</strong>. Sin embargo, Guardián Terrestre fue
      desarrollado como un prototipo educativo y experimental; por lo tanto, no pretende reemplazar
      a los equipos profesionales de búsqueda y rescate ni se presenta como un sistema listo para
      operar en situaciones reales de emergencia.
    </p>

    <p class="note">
      El proyecto permitió poner en funcionamiento un sistema mecatrónico completo: desde el diseño
      y montaje de la estructura hasta la programación, el control y las pruebas.
    </p>
  </div>
</section>

<!-- 02 · PROBLEMA Y OBJETIVOS -->
<section id="objetivos">
  <span class="watermark">02</span>
  <div class="wrap">
    <div class="sec-head"><span class="sec-badge">02</span><span class="sec-label">Problema y objetivos</span><span class="sec-line"></span></div>
    <h2>¿Qué buscamos resolver y cómo?</h2>

    <div class="grid2" style="margin-bottom:36px">
      <div class="cell reveal">
        <h3>Problema de investigación</h3>
        <p>¿Cómo puede un robot cuadrúpedo servir como herramienta de apoyo para explorar zonas de difícil acceso y obtener información útil para la búsqueda y localización de personas?</p>
      </div>
      <div class="cell reveal">
        <h3>Justificación</h3>
        <p>Un robot puede ingresar a lugares donde una persona correría riesgos, obtener imágenes del entorno y transmitir información al operador antes de que el equipo humano tome decisiones.</p>
      </div>
    </div>

    <h3 style="margin-top:24px;font-size:18px">Objetivo general</h3>
    <p>
      Construir un robot cuadrúpedo capaz de desplazarse de forma estable y funcionar como
      herramienta de apoyo para la exploración, búsqueda y localización de personas en zonas
      de difícil acceso.
    </p>

    <div class="items" style="margin-top:32px">
      <div class="item-row reveal">
        <div class="item-num">01</div>
        <div><h3>Sistema de control inalámbrico</h3><p>Desarrollar un sistema que permita operar el robot de forma remota y recibir imágenes durante las pruebas de exploración.</p></div>
      </div>
      <div class="item-row reveal">
        <div class="item-num">02</div>
        <div><h3>Sistema de locomoción</h3><p>Implementar la locomoción mediante servomotores para ejecutar movimientos básicos y desplazarse de manera estable sobre las superficies de prueba.</p></div>
      </div>
      <div class="item-row reveal">
        <div class="item-num">03</div>
        <div><h3>Integración de sensores y cámara</h3><p>Incorporar una cámara y sensores electrónicos que permitan observar el entorno y registrar información de inclinación y movimiento del prototipo.</p></div>
      </div>
      <div class="item-row reveal">
        <div class="item-num">04</div>
        <div><h3>Evaluación del funcionamiento</h3><p>Realizar pruebas de desplazamiento, estabilidad, control inalámbrico, respuesta de los componentes y transmisión de imágenes.</p></div>
      </div>
    </div>
  </div>
</section>

<!-- 03 · CÓMO FUNCIONA -->
<section id="como">
  <span class="watermark">03</span>
  <div class="wrap">
    <div class="sec-head"><span class="sec-badge">03</span><span class="sec-label">Funcionamiento</span><span class="sec-line"></span></div>
    <h2>De la orden al movimiento</h2>
    <p>
      El robot es <strong>teledirigido por Bluetooth</strong> y toda la lógica corre sobre
      <strong>Arduino IDE</strong>. El operador envía instrucciones desde un dispositivo móvil y
      recibe el video de la cámara en tiempo real.
    </p>

    <div class="items" style="margin-top:32px">
      <div class="item-row reveal">
        <div class="item-num">01</div>
        <div><h3>Detección</h3><p>Los sensores ultrasónicos y el MPU-6050 registran la distancia a los obstáculos, la inclinación y la aceleración del chasis.</p></div>
      </div>
      <div class="item-row reveal">
        <div class="item-num">02</div>
        <div><h3>Procesamiento</h3><p>El Arduino Mega 2560 interpreta las lecturas y calcula la marcha: avance, retroceso, giros, detención y mantenimiento de postura.</p></div>
      </div>
      <div class="item-row reveal">
        <div class="item-num">03</div>
        <div><h3>Distribución PWM</h3><p>El módulo PCA9685 reparte las señales a los 12 servomotores MG996R con precisión, sin saturar los pines del Arduino.</p></div>
      </div>
      <div class="item-row reveal">
        <div class="item-num">04</div>
        <div><h3>Visión remota</h3><p>La ESP32-CAM envía el flujo de video al operador, que decide el siguiente paso desde un lugar seguro.</p></div>
      </div>
    </div>
  </div>
</section>

<!-- 04 · COMPONENTES -->
<section id="specs">
  <span class="watermark">04</span>
  <div class="wrap">
    <div class="sec-head"><span class="sec-badge">04</span><span class="sec-label">Componentes</span><span class="sec-line"></span></div>
    <h2>Materiales y electrónica</h2>
    <p>Para la construcción y funcionamiento de Guardián Terrestre se utilizaron componentes mecánicos y electrónicos destinados a la locomoción, el control, la comunicación y la observación del entorno.</p>

    <div class="grid2" style="margin-top:32px">
      <div class="cell reveal"><h3>Arduino Mega 2560 <span class="badge">×1</span></h3><p>Control y procesamiento principal del sistema. Coordina la lógica de marcha y la lectura de sensores.</p></div>
      <div class="cell reveal"><h3>Servomotores MG996R <span class="badge">×12</span></h3><p>Tres por pata: cadera, rodilla y tobillo. Movimiento de las articulaciones con gran torque.</p></div>
      <div class="cell reveal"><h3>Driver PCA9685 <span class="badge">×1</span></h3><p>Controlador PWM de 16 canales. Maneja los 12 servos sin agotar los pines del Arduino.</p></div>
      <div class="cell reveal"><h3>Sensor MPU-6050 <span class="badge">×1</span></h3><p>Detección de inclinación, aceleración y movimiento. Informa la orientación del chasis en tiempo real.</p></div>
      <div class="cell reveal"><h3>Sensores ultrasónicos HC-SR04 <span class="badge">×2</span></h3><p>Miden distancias por eco. Detectan obstáculos al frente y a los costados.</p></div>
      <div class="cell reveal"><h3>Módulo Bluetooth <span class="badge">×1</span></h3><p>Comunicación inalámbrica entre el operador y el robot. Alcance probado de hasta 10 m en espacio libre.</p></div>
      <div class="cell reveal"><h3>Cámara ESP32-CAM <span class="badge">×1</span></h3><p>Captura y transmisión de imágenes en vivo para la observación remota del entorno.</p></div>
      <div class="cell reveal"><h3>Batería LiPo 7.4 V <span class="badge">×1</span></h3><p>2200 mAh · 25C. Suministro de energía del sistema, regulado mediante un módulo Buck.</p></div>
      <div class="cell reveal"><h3>Estructura mecánica</h3><p>Piezas fabricadas en impresión 3D (PLA), ensambladas con tornillos, tuercas y rodamientos.</p></div>
      <div class="cell reveal"><h3>Patas articuladas</h3><p>Cuatro extremidades con tres grados de libertad cada una. Sistema principal de locomoción.</p></div>
    </div>
  </div>
</section>

<!-- 05 · FICHA TÉCNICA -->
<section id="ficha">
  <span class="watermark">05</span>
  <div class="wrap">
    <div class="sec-head"><span class="sec-badge">05</span><span class="sec-label">Ficha técnica</span><span class="sec-line"></span></div>
    <h2>Datos rápidos</h2>
    <div class="ficha" style="margin-top:24px">
      <div class="ficha-row reveal"><span class="k">Chasis</span><span class="v">Impresión 3D · PLA · blanco y negro</span></div>
      <div class="ficha-row reveal"><span class="k">Peso</span><span class="v">≈ 1 kg</span></div>
      <div class="ficha-row reveal"><span class="k">Dimensiones</span><span class="v">24 – 26 cm de largo</span></div>
      <div class="ficha-row reveal"><span class="k">Alimentación</span><span class="v">LiPo 7.4 V · 2200 mAh · 25C</span></div>
      <div class="ficha-row reveal"><span class="k">Software</span><span class="v">Arduino IDE</span></div>
      <div class="ficha-row reveal"><span class="k">Control</span><span class="v">Bluetooth · teledirigido</span></div>
      <div class="ficha-row reveal"><span class="k">Alcance probado</span><span class="v">10 m en espacio libre</span></div>
      <div class="ficha-row reveal"><span class="k">Velocidad media</span><span class="v">0.24 m/s en pista plana</span></div>
      <div class="ficha-row reveal"><span class="k">Video</span><span class="v">720p · 15 fps · ~120 ms de latencia</span></div>
      <div class="ficha-row reveal"><span class="k">Costo unitario</span><span class="v">1.548.000 Gs. (variable)</span></div>
      <div class="ficha-row reveal"><span class="k">Estado</span><span class="v">Prototipo funcional · en pruebas</span></div>
    </div>
  </div>
</section>

<!-- 06 · ANTECEDENTES -->
<section id="antecedentes">
  <span class="watermark">06</span>
  <div class="wrap">
    <div class="sec-head"><span class="sec-badge">06</span><span class="sec-label">Antecedentes</span><span class="sec-line"></span></div>
    <h2>Referencias internacionales</h2>
    <p>El proyecto tomó como referencia cinco plataformas cuadrúpedas reconocidas a nivel internacional. Cada una aportó principios de diseño, control y aplicación que fueron considerados durante el desarrollo.</p>

    <div class="antecedentes" style="margin-top:24px">
      <div class="ante-row reveal">
        <div class="ante-num">01</div>
        <div>
          <h3>Spot — Boston Dynamics</h3>
          <p>Plataforma comercial de referencia mundial en robótica cuadrúpeda. Sirvió como base conceptual para comprender la distribución mecánica de las patas, el equilibrio dinámico y la percepción tridimensional del entorno.</p>
        </div>
      </div>
      <div class="ante-row reveal">
        <div class="ante-num">02</div>
        <div>
          <h3>Spot Micro AI</h3>
          <p>Proyecto de código abierto que reproduce las ideas de Spot usando impresión 3D y componentes accesibles. Es el antecedente más cercano al prototipo y la base técnica utilizada para el diseño de Guardián Terrestre.</p>
        </div>
      </div>
      <div class="ante-row reveal">
        <div class="ante-num">03</div>
        <div>
          <h3>Stanford Pupper</h3>
          <p>Robot cuadrúpedo educativo de bajo costo desarrollado por la Universidad de Stanford. Aportó estrategias de coordinación de patas y algoritmos de locomoción aplicables a proyectos académicos.</p>
        </div>
      </div>
      <div class="ante-row reveal">
        <div class="ante-num">04</div>
        <div>
          <h3>Mini Cheetah — MIT</h3>
          <p>Plataforma de investigación centrada en locomoción dinámica y agilidad. Sus aportes en control de estabilidad y respuesta ante perturbaciones orientaron aspectos del diseño mecánico y de control.</p>
        </div>
