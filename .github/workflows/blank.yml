<!-- FOOTER -->
<footer>
  <div class="wrap foot">
    <div>
      <div class="foot-brand">Guardián Terrestre</div>
      <span>Proyecto de EXPOTEC 2026 · Colegio Salesianito · Asunción, Paraguay</span>
      <div class="foot-meta">Sitio oficial · <b>v1.0</b> · Publicado <b id="pubDate">—</b></div>
    </div>
    <span>© <span id="year"></span> · Autores: Equipo S.A.C. — Santi, Alan, Ceci</span>
  </div>
</footer>

<script>
  /* Año y fecha */
  const now = new Date();
  document.getElementById('year').textContent = now.getFullYear();
  document.getElementById('pubDate').textContent =
    now.toLocaleDateString('es-ES', { day:'numeric', month:'long', year:'numeric' });

  /* Barra de progreso */
  const progress = document.getElementById('progress');
  function updateProgress(){
    const h = document.documentElement;
    const total = h.scrollHeight - h.clientHeight;
    progress.style.width = total > 0 ? (h.scrollTop / total * 100) + '%' : '0%';
  }
  window.addEventListener('scroll', updateProgress, {passive:true});
  updateProgress();

  /* Menú móvil */
  const toggle = document.getElementById('navToggle');
  const links = document.getElementById('navLinks');
  toggle.addEventListener('click', () => {
    toggle.classList.toggle('open');
    links.classList.toggle('open');
  });

  /* Navegación suave */
  function navHeight(){ return document.querySelector('nav').offsetHeight; }
  function scrollToTarget(hash){
    const target = document.querySelector(hash);
    if (!target) return;
    const top = target.getBoundingClientRect().top + window.scrollY - navHeight() - 8;
    window.scrollTo({ top: Math.max(0, top), behavior:'smooth' });
  }
  document.querySelectorAll('a[href^="#"]').forEach(a => {
    a.addEventListener('click', e => {
      const hash = a.getAttribute('href');
      if (hash === '#') return;
      const target = document.querySelector(hash);
      if (!target) return;
      e.preventDefault();
      scrollToTarget(hash);
      history.replaceState(null, '', hash);
      toggle.classList.remove('open');
      links.classList.remove('open');
    });
  });

  /* Enlace activo */
  const sections = document.querySelectorAll('section[id], header[id]');
  const navAnchors = document.querySelectorAll('.nav-links a');
  let ticking = false;
  function setActive(){
    const y = window.scrollY + navHeight() + 40;
    let current = '';
    sections.forEach(s => { if (y >= s.offsetTop) current = s.id; });
    navAnchors.forEach(a => a.classList.toggle('active', a.getAttribute('href') === '#' + current));
    ticking = false;
  }
  window.addEventListener('scroll', () => {
    if (!ticking){ requestAnimationFrame(setActive); ticking = true; }
  }, {passive:true});
  setActive();

  /* FAQ */
  document.querySelectorAll('.faq-item').forEach(item => {
    const q = item.querySelector('.faq-q');
    const a = item.querySelector('.faq-a');
    q.addEventListener('click', () => {
      const isOpen = item.classList.contains('open');
      document.querySelectorAll('.faq-item').forEach(i => {
        i.classList.remove('open');
        i.querySelector('.faq-a').style.maxHeight = null;
      });
      if (!isOpen){ item.classList.add('open'); a.style.maxHeight = a.scrollHeight + 'px'; }
    });
  });

  /* Reveal en cascada */
  const groups = new Map();
  document.querySelectorAll('.reveal').forEach(el => {
    const parent = el.parentElement;
    if (!groups.has(parent)) groups.set(parent, []);
    groups.get(parent).push(el);
  });
  groups.forEach(children => {
    children.forEach((child, i) => {
      child.style.transitionDelay = Math.min(i * 180, 900) + 'ms';
    });
  });
  const io = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting){ e.target.classList.add('visible'); io.unobserve(e.target); }
    });
  }, {threshold:0.08, rootMargin:'0px 0px -60px 0px'});
  document.querySelectorAll('.reveal').forEach(el => io.observe(el));

  /* Gráfico de barras animado */
  const chart = document.getElementById('chart');
  if (chart){
    const cio = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting){
          chart.querySelectorAll('.bar-fill').forEach((bar, i) => {
            setTimeout(() => bar.classList.add('visible'), i * 180);
          });
          cio.unobserve(chart);
        }
      });
    }, {threshold:0.25});
    cio.observe(chart);
  }

  /* Formulario demo */
  document.getElementById('contactForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const note = document.getElementById('formNote');
    note.textContent = '✓ Mensaje capturado (demo). Conectá un servicio real para enviarlo.';
    note.style.color = 'var(--accent)';
    e.target.reset();
  });
</script>
</body>
</html>
